name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated] # R3: lo dispara la API al publicar contenido

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:edge
      - run: pnpm build
        env:
          VITE_DATA_SOURCE: ${{ vars.DATA_SOURCE }} # static en R1
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_API_BASE_URL: /api
          VITE_ENABLE_ADMIN: ${{ vars.ENABLE_ADMIN }} # false en R1 y R2
          VITE_ENABLE_MSW: 'false'
          API_BUILD_URL: ${{ vars.API_BUILD_URL }} # solo en modo api (R3)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # Orden: primero los assets nuevos (con hash) y después el HTML que los referencia
      - name: Subir assets inmutables
        run: >
          aws s3 sync build/client/assets s3://${{ vars.WEB_BUCKET }}/assets
          --cache-control "public,max-age=31536000,immutable"
      - name: Subir HTML, .data y el resto
        run: >
          aws s3 sync build/client s3://${{ vars.WEB_BUCKET }} --exclude "assets/*"
          --cache-control "public,max-age=0,must-revalidate" --delete
      - name: Limpiar assets viejos
        run: >
          aws s3 sync build/client/assets s3://${{ vars.WEB_BUCKET }}/assets
          --cache-control "public,max-age=31536000,immutable" --delete
      - name: Invalidar CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} --paths "/*"
      - name: Prueba de humo
        run: |
          curl -fsS -o /dev/null -w "%{http_code} /es\n" "${{ vars.SITE_URL }}/es"
          curl -fsS -o /dev/null -w "%{http_code} /en\n" "${{ vars.SITE_URL }}/en"
          test "$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.SITE_URL }}/")" = "302"
